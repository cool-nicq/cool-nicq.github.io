<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guessing Game</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            40% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.1s ease-in-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        const RefreshCw = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M3 21v-5h5"></path></svg>;
        const Delete = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>;
        const Trophy = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>;
        const AlertCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;

        const MAX_ATTEMPTS = 6;
        const DICTIONARY_URL = "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt";

        function Tile({ value, status }) {
            const baseClasses = `w-14 h-14 sm:w-16 sm:h-16 border-2 flex items-center justify-center font-bold rounded transition-all duration-500 transform text-2xl sm:text-3xl`;
            let statusClasses = "border-neutral-700 text-white";
            
            if (status === 'active') statusClasses = "border-neutral-500 text-white animate-pop";
            else if (status === 'correct') statusClasses = "border-green-600 bg-green-600 text-white"; 
            else if (status === 'present') statusClasses = "border-yellow-500 bg-yellow-500 text-white"; 
            else if (status === 'absent') statusClasses = "border-neutral-800 bg-neutral-800 text-white"; 

            return <div className={`${baseClasses} ${statusClasses}`}>{value}</div>;
        }

        function Row({ guess, solution, isFinal, shake, length }) {
            let solutionChars = solution.split('');
            const status = new Array(length).fill('empty');
            if (isFinal) {
                const guessChars = guess.split('');
                guessChars.forEach((char, i) => { if (char === solutionChars[i]) { status[i] = 'correct'; solutionChars[i] = null; } });
                guessChars.forEach((char, i) => {
                    if (status[i] !== 'correct') {
                        const idx = solutionChars.indexOf(char);
                        if (idx > -1) { status[i] = 'present'; solutionChars[idx] = null; }
                        else status[i] = 'absent';
                    }
                });
            }
            return (
                <div 
                    className={`flex justify-center gap-2 ${shake ? 'animate-shake' : ''}`}
                >
                    {Array.from({ length }).map((_, i) => (
                        <Tile key={i} value={guess[i]} status={isFinal ? status[i] : (guess[i] ? 'active' : 'empty')} />
                    ))}
                </div>
            );
        }

        function App() {
            const [dictionary, setDictionary] = useState([]);
            const [solution, setSolution] = useState('');
            const [guesses, setGuesses] = useState([]);
            const [currentGuess, setCurrentGuess] = useState('');
            const [gameStatus, setGameStatus] = useState('playing');
            const [usedKeys, setUsedKeys] = useState({});
            const [isInvalidShake, setIsInvalidShake] = useState(false);
            const [showModal, setShowModal] = useState(false);
            const [loading, setLoading] = useState(true);

            // Fetch Online Dictionary
            useEffect(() => {
                fetch(DICTIONARY_URL)
                    .then(res => res.text())
                    .then(text => {
                        const words = text.split('\n')
                            .map(w => w.trim().toUpperCase())
                            .filter(w => w.length >= 4 && w.length <= 6);
                        setDictionary(words);
                        setLoading(false);
                    })
                    .catch(() => {
                        setDictionary(["CODE", "FISH", "BIRD", "APPLE", "RHYTHM", "GUITAR", "PLANET"]);
                        setLoading(false);
                    });
            }, []);

            const startNewGame = useCallback(() => {
                if (dictionary.length === 0) return;
                const randomWord = dictionary[Math.floor(Math.random() * dictionary.length)];
                setSolution(randomWord);
                setGuesses([]);
                setCurrentGuess('');
                setGameStatus('playing');
                setUsedKeys({});
                setShowModal(false);
            }, [dictionary]);

            useEffect(() => {
                if (!loading) startNewGame();
            }, [loading, startNewGame]);

            const submitGuess = useCallback(() => {
                if (currentGuess.length !== solution.length) {
                    setIsInvalidShake(true);
                    setTimeout(() => setIsInvalidShake(false), 500);
                    return;
                }
                const newGuesses = [...guesses, currentGuess];
                setGuesses(newGuesses);
                
                const newKeys = {...usedKeys};
                currentGuess.split('').forEach((char, i) => {
                    if (solution[i] === char) newKeys[char] = 'green';
                    else if (solution.includes(char) && newKeys[char] !== 'green') newKeys[char] = 'yellow';
                    else if (!solution.includes(char) && newKeys[char] !== 'green' && newKeys[char] !== 'yellow') newKeys[char] = 'gray';
                });
                setUsedKeys(newKeys);

                if (currentGuess === solution) { setGameStatus('won'); setShowModal(true); }
                else if (newGuesses.length >= MAX_ATTEMPTS) { setGameStatus('lost'); setShowModal(true); }
                setCurrentGuess('');
            }, [currentGuess, solution, guesses, usedKeys]);

            const onKeyPress = useCallback((key) => {
                if (gameStatus !== 'playing') return;
                if (key === 'BACKSPACE') setCurrentGuess(prev => prev.slice(0, -1));
                else if (key === 'ENTER') submitGuess();
                else if (currentGuess.length < solution.length && /^[A-Z]$/.test(key)) {
                    setCurrentGuess(prev => prev + key);
                }
            }, [gameStatus, currentGuess, solution, submitGuess]);

            if (loading) return (
                <div className="min-h-screen bg-neutral-900 flex items-center justify-center text-white">
                    <div className="flex flex-col items-center gap-4">
                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-xl font-bold animate-pulse">Loading Dictionary...</p>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-neutral-900 text-white flex flex-col items-center justify-between p-4 font-sans">
                    <header className="w-full max-w-lg flex items-center justify-between py-4 border-b border-neutral-700">
                        <div>
                            <h1 className="text-xl font-black tracking-tighter text-blue-500 uppercase">Word Master</h1>
                            <p className="text-[10px] text-neutral-500 uppercase tracking-widest">{solution.length} Letter Word</p>
                        </div>
                        <button onClick={startNewGame} className="p-2 hover:bg-neutral-800 rounded-full transition-colors"><RefreshCw /></button>
                    </header>

                    {/* Game Grid */}
                    <div className="flex-1 flex flex-col justify-center gap-2 w-full max-w-lg">
                        {Array.from({ length: MAX_ATTEMPTS }).map((_, i) => {
                            const isCurrentRow = i === guesses.length;
                            const isPastRow = i < guesses.length;
                            
                            return (
                                <Row 
                                    key={i} 
                                    guess={isPastRow ? guesses[i] : (isCurrentRow ? currentGuess : '')} 
                                    solution={solution} 
                                    isFinal={isPastRow} 
                                    shake={isCurrentRow && isInvalidShake} 
                                    length={solution.length} 
                                />
                            );
                        })}
                    </div>

                    <div className="w-full max-w-2xl flex flex-col items-center gap-6 pb-4">
                        
                        {/* Highlighted Submit Button */}
                        <button 
                            onClick={submitGuess}
                            disabled={currentGuess.length !== solution.length || gameStatus !== 'playing'}
                            className={`w-full max-w-lg py-4 rounded-xl font-black text-lg transition-all transform active:scale-95 shadow-lg ${
                                currentGuess.length === solution.length && gameStatus === 'playing'
                                ? 'bg-blue-600 hover:bg-blue-500 text-white' 
                                : 'bg-neutral-800 text-neutral-500 cursor-not-allowed opacity-50'
                            }`}
                        >
                            SUBMIT GUESS
                        </button>

                        {/* Keyboard */}
                        <div className="w-full flex flex-col gap-2">
                            {[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','BACKSPACE']].map((row, i) => (
                                <div key={i} className="flex justify-center gap-1.5">
                                    {row.map(k => (
                                        <button 
                                            key={k} 
                                            onClick={() => onKeyPress(k)} 
                                            className={`h-14 flex-1 rounded-lg font-bold transition-all ${
                                                k === 'BACKSPACE' ? 'flex-[1.5] bg-neutral-700' :
                                                usedKeys[k] === 'green' ? 'bg-green-600' : 
                                                usedKeys[k] === 'yellow' ? 'bg-yellow-500' : 
                                                usedKeys[k] === 'gray' ? 'bg-neutral-800 opacity-40' : 
                                                'bg-neutral-700 hover:bg-neutral-600'
                                            }`}
                                        >
                                            {k === 'BACKSPACE' ? <div className="flex justify-center"><Delete /></div> : k}
                                        </button>
                                    ))}
                                </div>
                            ))}
                        </div>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-neutral-800 p-8 rounded-3xl text-center flex flex-col items-center gap-6 border border-neutral-700 shadow-2xl max-w-sm w-full">
                                {gameStatus === 'won' ? (
                                    <div className="animate-bounce"><Trophy /></div>
                                ) : (
                                    <AlertCircle />
                                )}
                                <div className="space-y-1">
                                    <h2 className="text-3xl font-black">{gameStatus === 'won' ? 'VICTORY!' : 'OUT OF LUCK'}</h2>
                                    <p className="text-neutral-400">The hidden word was</p>
                                    <span className="block text-4xl font-black text-blue-500 tracking-widest uppercase">{solution}</span>
                                </div>
                                <button 
                                    onClick={startNewGame} 
                                    className="w-full bg-white text-black py-4 rounded-xl font-black text-lg hover:bg-blue-50 transition-colors shadow-lg"
                                >
                                    PLAY AGAIN
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
