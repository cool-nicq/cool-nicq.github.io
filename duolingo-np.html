<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoNepal - Learn Nepali & Newari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .animate-bounce-slow { animation: bounce 3s infinite; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="app" class="min-h-screen max-w-md mx-auto relative overflow-hidden bg-white shadow-2xl">
        <!-- Content injected via JavaScript -->
    </div>

    <script>
        // --- DATA STRUCTURE ---
        const VOCABULARY = [
            { id: 1, level: 1, category: "Body Parts", nepali: "टाउको", newari: "छ्यँ", english: "Head" },
            { id: 2, level: 1, category: "Body Parts", nepali: "आँखा", newari: "मिखा", english: "Eyes" },
            { id: 3, level: 1, category: "Body Parts", nepali: "हात", newari: "ल्हा", english: "Hand" },
            { id: 4, level: 1, category: "Body Parts", nepali: "खुट्टा", newari: "तुति", english: "Leg" },
            { id: 5, level: 2, category: "Numbers", nepali: "एक", newari: "छ", english: "One" },
            { id: 6, level: 2, category: "Numbers", nepali: "दुई", newari: "नसि", english: "Two" },
            { id: 7, level: 2, category: "Numbers", nepali: "तीन", newari: "स्व", english: "Three" },
            { id: 8, level: 3, category: "Family", nepali: "बुबा", newari: "अब्वा", english: "Father" },
            { id: 9, level: 3, category: "Family", nepali: "आमा", newari: "अँमा", english: "Mother" },
            { id: 10, level: 4, category: "Daily Words", nepali: "पानी", newari: "लः", english: "Water" },
            { id: 11, level: 4, category: "Daily Words", nepali: "भात", newari: "जा", english: "Rice" },
            { id: 12, level: 5, category: "Sentences", nepali: "म भात खान्छु", newari: "जि जा नया", english: "I eat rice" },
        ];

        const LEVELS = [
            { id: 1, title: "Body Parts", icon: "👤", minXp: 0 },
            { id: 2, title: "Numbers", icon: "🔢", minXp: 100 },
            { id: 3, title: "Family", icon: "👨‍👩‍👧", minXp: 250 },
            { id: 4, title: "Daily Words", icon: "🍲", minXp: 450 },
            { id: 5, title: "Sentences", icon: "💬", minXp: 700 },
        ];

        // --- APP STATE ---
        let state = {
            view: 'welcome',
            direction: 'nepToNew',
            user: JSON.parse(localStorage.getItem('lingo_nepal_user')) || { name: '', xp: 0, streak: 0, hearts: 3 },
            activeLesson: null,
            feedback: null,
            isListening: false
        };

        // --- UTILS ---
        const saveUser = () => localStorage.setItem('lingo_nepal_user', JSON.stringify(state.user));
        const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        };

        const render = () => {
            const container = document.getElementById('app');
            container.innerHTML = views[state.view]();
            lucide.createIcons();
        };

        // --- CORE ACTIONS ---
        const setView = (v) => { state.view = v; render(); };
        
        const startLesson = (levelId) => {
            const levelVocab = VOCABULARY.filter(v => v.level === levelId);
            const exercises = shuffle(levelVocab).map(item => {
                const type = Math.random() > 0.4 ? 'multiple' : 'speaking';
                const question = state.direction === 'nepToNew' ? item.nepali : item.newari;
                const answer = state.direction === 'nepToNew' ? item.newari : item.nepali;
                
                let options = [answer];
                const distractors = VOCABULARY.filter(v => v.id !== item.id).map(v => 
                    state.direction === 'nepToNew' ? v.newari : v.nepali
                );
                options = [...new Set([...options, ...shuffle(distractors).slice(0, 3)])];

                return { ...item, type, question, answer, options: shuffle(options) };
            });

            state.activeLesson = { levelId, exercises, currentIndex: 0 };
            state.view = 'lesson';
            render();
        };

        const checkAnswer = (selected) => {
            if (state.feedback) return;
            const current = state.activeLesson.exercises[state.activeLesson.currentIndex];
            const isCorrect = selected.trim().toLowerCase() === current.answer.trim().toLowerCase();

            // Speaking mode is more lenient - if we got any result, we count it for this demo
            const finalCorrect = current.type === 'speaking' ? (selected.length > 0) : isCorrect;

            if (finalCorrect) {
                state.feedback = { status: 'correct', msg: 'अति राम्रो! (Excellent!)' };
                state.user.xp += 10;
                speak(current.answer);
            } else {
                state.feedback = { status: 'wrong', msg: `सही उत्तर: ${current.answer}` };
                state.user.hearts = Math.max(0, state.user.hearts - 1);
            }
            saveUser();
            render();
        };

        const nextStep = () => {
            state.feedback = null;
            if (state.user.hearts <= 0) {
                state.user.hearts = 3;
                saveUser();
                setView('home');
                return;
            }

            if (state.activeLesson.currentIndex + 1 >= state.activeLesson.exercises.length) {
                state.user.xp += 50;
                state.user.streak += 1;
                saveUser();
                setView('results');
            } else {
                state.activeLesson.currentIndex++;
                render();
            }
        };

        // Improved Start Listening with auto-stop
        const startListening = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Please try Chrome or Safari.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.continuous = false; // Ensure it doesn't keep listening forever

            recognition.onstart = () => { 
                state.isListening = true; 
                render(); 
            };

            recognition.onend = () => { 
                state.isListening = false; 
                render(); 
            };

            recognition.onerror = (event) => {
                state.isListening = false;
                render();
                if (event.error !== 'aborted') {
                    console.error("Speech recognition error:", event.error);
                }
            };

            recognition.onresult = (event) => {
                // IMMEDIATELY stop recognition once a result is found
                recognition.stop();
                state.isListening = false;
                
                const transcript = event.results[0][0].transcript;
                checkAnswer(transcript);
            };

            try {
                recognition.start();
            } catch (e) {
                state.isListening = false;
                render();
            }
        };

        // --- VIEW TEMPLATES ---
        const views = {
            welcome: () => `
                <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div class="w-32 h-32 bg-green-100 rounded-3xl flex items-center justify-center mb-6 animate-bounce-slow text-6xl">🇳🇵</div>
                    <h1 class="text-4xl font-black text-green-600 mb-2">LingoNepal</h1>
                    <p class="text-gray-500 mb-12 text-lg">Learn Nepali & Newari effectively.</p>
                    <button onclick="setView('setup')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg transform active:scale-95 transition-all mb-4 uppercase">Get Started</button>
                </div>`,

            setup: () => `
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-8">Choose your path</h2>
                    <div class="space-y-4 mb-8">
                        <button onclick="state.direction='nepToNew'; render()" class="w-full p-6 rounded-2xl border-2 flex items-center justify-between ${state.direction === 'nepToNew' ? 'border-green-500 bg-green-50' : 'border-gray-200'}">
                            <span class="font-bold">Nepali → Newari</span>
                        </button>
                        <button onclick="state.direction='newToNep'; render()" class="w-full p-6 rounded-2xl border-2 flex items-center justify-between ${state.direction === 'newToNep' ? 'border-green-500 bg-green-50' : 'border-gray-200'}">
                            <span class="font-bold">Newari → Nepali</span>
                        </button>
                    </div>
                    <input id="userNameInput" type="text" placeholder="Your Name" value="${state.user.name}" oninput="state.user.name=this.value" class="w-full p-4 bg-gray-100 rounded-xl mb-8 outline-none ring-blue-500 focus:ring-2">
                    <button onclick="saveUser(); setView('home')" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-md">CONTINUE</button>
                </div>`,

            home: () => `
                <header class="bg-white border-b sticky top-0 p-4 flex justify-between items-center z-20">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-1 text-orange-500"><i data-lucide="flame" class="fill-current"></i><span class="font-bold">${state.user.streak}</span></div>
                        <div class="flex items-center gap-1 text-yellow-500"><i data-lucide="trophy"></i><span class="font-bold">${state.user.xp}</span></div>
                    </div>
                    <div class="flex items-center gap-1 text-red-500"><i data-lucide="heart" class="fill-current"></i><span class="font-bold">${state.user.hearts}</span></div>
                </header>
                <main class="p-6 space-y-10 flex flex-col items-center">
                    ${LEVELS.map(l => {
                        const isLocked = state.user.xp < l.minXp;
                        return `
                        <div class="text-center">
                            <button onclick="${isLocked ? '' : `startLesson(${l.id})`}" class="w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-xl border-b-8 active:border-b-0 active:translate-y-1 transition-all ${isLocked ? 'bg-gray-300 border-gray-400 grayscale' : 'bg-green-500 border-green-700'}">
                                ${l.icon}
                            </button>
                            <p class="mt-2 font-bold ${isLocked ? 'text-gray-400' : ''}">${l.title}</p>
                        </div>`;
                    }).join('')}
                </main>
                <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 flex justify-around">
                    <i data-lucide="home" class="text-blue-500"></i>
                    <i data-lucide="award" class="text-gray-400"></i>
                    <i data-lucide="user" class="text-gray-400"></i>
                </nav>`,

            lesson: () => {
                const current = state.activeLesson.exercises[state.activeLesson.currentIndex];
                const progress = (state.activeLesson.currentIndex / state.activeLesson.exercises.length) * 100;
                return `
                <div class="p-6 flex flex-col h-screen">
                    <div class="flex items-center gap-4 mb-8">
                        <button onclick="setView('home')"><i data-lucide="x" class="text-gray-400"></i></button>
                        <div class="flex-grow bg-gray-200 h-3 rounded-full overflow-hidden"><div class="bg-green-500 h-full transition-all" style="width: ${progress}%"></div></div>
                        <div class="flex items-center gap-1 text-red-500"><i data-lucide="heart" class="fill-current" size="18"></i><span class="font-bold">${state.user.hearts}</span></div>
                    </div>
                    <div class="flex-grow">
                        <h2 class="text-2xl font-bold mb-4">${current.type === 'multiple' ? 'Pick the correct answer' : 'Pronounce clearly'}</h2>
                        <div class="flex items-center gap-3 mb-8">
                            <button onclick="speak('${current.question}')" class="p-3 bg-blue-100 text-blue-600 rounded-xl"><i data-lucide="volume-2"></i></button>
                            <span class="text-3xl font-bold">${current.question}</span>
                            <span class="text-gray-400 text-sm">(${current.english})</span>
                        </div>
                        ${current.type === 'multiple' ? `
                            <div class="grid gap-3">
                                ${current.options.map(opt => `
                                    <button onclick="checkAnswer('${opt}')" class="p-4 border-2 rounded-2xl text-left font-bold transition-all ${state.feedback?.status === 'correct' && opt === current.answer ? 'bg-green-100 border-green-500 text-green-700' : 'border-gray-200 hover:bg-gray-50'}">${opt}</button>
                                `).join('')}
                            </div>` : `
                            <div class="flex flex-col items-center py-10">
                                <button id="micBtn" onclick="startListening()" class="w-32 h-32 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90 ${state.isListening ? 'bg-red-500 animate-pulse shadow-red-200 shadow-2xl' : 'bg-blue-500'}">
                                    <i data-lucide="mic" class="text-white" size="48"></i>
                                </button>
                                <p class="mt-4 text-gray-400 font-bold">${state.isListening ? 'Recording... Finish speaking' : 'Tap to Speak'}</p>
                            </div>`}
                    </div>
                    ${state.feedback ? `
                        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-6 border-t-8 animate-slide-up ${state.feedback.status === 'correct' ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}">
                            <div class="flex items-center gap-3 mb-4">
                                <i data-lucide="${state.feedback.status === 'correct' ? 'check-circle' : 'alert-circle'}" class="${state.feedback.status === 'correct' ? 'text-green-600' : 'text-red-600'}"></i>
                                <span class="font-bold text-xl ${state.feedback.status === 'correct' ? 'text-green-800' : 'text-red-800'}">${state.feedback.msg}</span>
                            </div>
                            <button onclick="nextStep()" class="w-full py-4 rounded-2xl font-black text-white ${state.feedback.status === 'correct' ? 'bg-green-500' : 'bg-red-500'}">CONTINUE</button>
                        </div>` : ''}
                </div>`;
            },

            results: () => `
                <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
                    <i data-lucide="trophy" class="text-yellow-400 mb-6" size="120"></i>
                    <h2 class="text-3xl font-black mb-2">Lesson Finished!</h2>
                    <p class="text-gray-500 mb-8">Great progress today.</p>
                    <div class="grid grid-cols-2 gap-4 w-full mb-8">
                        <div class="p-4 bg-orange-50 border-2 border-orange-100 rounded-2xl"><p class="text-xs font-bold text-orange-400 uppercase">XP</p><p class="text-2xl font-black">+50</p></div>
                        <div class="p-4 bg-blue-50 border-2 border-blue-100 rounded-2xl"><p class="text-xs font-bold text-blue-400 uppercase">Streak</p><p class="text-2xl font-black">${state.user.streak}</p></div>
                    </div>
                    <button onclick="setView('home')" class="w-full bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg">AWESOME</button>
                </div>`
        };

        // Initialize App
        render();
    </script>
</body>
</html>
