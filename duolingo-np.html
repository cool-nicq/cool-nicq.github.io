            user: JSON.parse(localStorage.getItem('lingo_nepal_user')) || { name: '', xp: 0, streak: 0, hearts: 3 },
            activeLesson: null,
            feedback: null,
            isListening: false,
            currentRecognition: null
        };

        // --- UTILS ---
        const saveUser = () => localStorage.setItem('lingo_nepal_user', JSON.stringify(state.user));
        const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

        const speak = (text) => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            window.speechSynthesis.speak(utterance);
        };

        const render = () => {
            const container = document.getElementById('app');
            container.innerHTML = views[state.view]();
            lucide.createIcons();
        };

        // --- CORE ACTIONS ---
        const setView = (v) => { 
            if (state.currentRecognition) {
                state.currentRecognition.stop();
                state.currentRecognition = null;
            }
            state.view = v; 
            render(); 
        };
        
        const startLesson = (levelId) => {
            const levelVocab = VOCABULARY[levelId] || [];
            
            // Collect ALL vocabulary items to use as distractors
            const allItems = Object.entries(VOCABULARY).flatMap(([cat, items]) => 
                items.map(item => ({ ...item, category: cat }))
            );
            
            // Create randomized exercises
            const exercises = shuffle(levelVocab).map(item => {
                // Randomize between speaking and multiple choice
                const type = Math.random() > 0.4 ? 'multiple' : 'speaking';
                const question = state.direction === 'nepToNew' ? item.nepali : item.newari;
                const answer = state.direction === 'nepToNew' ? item.newari : item.nepali;
                
                let options = [answer];
                
                // Filter distractors: must not be the correct answer text
                const possibleDistractors = allItems
                    .map(v => state.direction === 'nepToNew' ? v.newari : v.nepali)
                    .filter(val => val !== answer);
                
                // Pick 3 unique random distractors
                const selectedDistractors = shuffle([...new Set(possibleDistractors)]).slice(0, 3);
                options = shuffle([...options, ...selectedDistractors]);

                return { ...item, type, question, answer, options };
            });

            state.activeLesson = { levelId, exercises, currentIndex: 0 };
            state.view = 'lesson';
            render();
        };

        const checkAnswer = (selected, skipped = false) => {
            if (state.feedback) return;
            const current = state.activeLesson.exercises[state.activeLesson.currentIndex];
            
            if (skipped) {
                state.feedback = { status: 'skipped', msg: `No problem! Answer: ${current.answer}` };
                render();
                return;
            }

            const isCorrect = selected.trim().toLowerCase() === current.answer.trim().toLowerCase();
            const finalCorrect = current.type === 'speaking' ? (selected.length > 0) : isCorrect;

            if (finalCorrect) {
                state.feedback = { status: 'correct', msg: 'अति राम्रो! (Excellent!)' };
                state.user.xp += 10;
                speak(current.answer);
            } else {
                state.feedback = { status: 'wrong', msg: `सही उत्तर: ${current.answer}` };
                state.user.hearts = Math.max(0, state.user.hearts - 1);
            }
            saveUser();
            render();
        };

        const nextStep = () => {
            state.feedback = null;
            if (state.user.hearts <= 0) {
                state.user.hearts = 3;
                saveUser();
                setView('home');
                return;
            }

            if (state.activeLesson.currentIndex + 1 >= state.activeLesson.exercises.length) {
                state.user.xp += 50;
                state.user.streak += 1;
                saveUser();
                setView('results');
            } else {
                state.activeLesson.currentIndex++;
                render();
            }
        };

        const startListening = () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in this browser.");
                return;
            }

            const recognition = new SpeechRecognition();
            state.currentRecognition = recognition;
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => { state.isListening = true; render(); };
            recognition.onend = () => { state.isListening = false; render(); };
            recognition.onerror = () => { state.isListening = false; render(); };

            recognition.onresult = (event) => {
                recognition.stop();
                state.isListening = false;
                checkAnswer(event.results[0][0].transcript);
            };

            try { recognition.start(); } catch (e) { state.isListening = false; render(); }
        };

        // --- VIEW TEMPLATES ---
        const views = {
            welcome: () => `
                <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div class="w-32 h-32 bg-green-100 rounded-3xl flex items-center justify-center mb-6 animate-bounce-slow text-6xl shadow-inner">🇳🇵</div>
                    <h1 class="text-4xl font-black text-green-600 mb-2">LingoNepal</h1>
                    <p class="text-gray-500 mb-12 text-lg">Vocabulary & Fluency Master</p>
                    <button onclick="setView('setup')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg transform active:scale-95 transition-all mb-4 uppercase tracking-wider">Get Started</button>
                </div>`,

            setup: () => `
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-8">Choose Path</h2>
                    <div class="space-y-4 mb-8">
                        <button onclick="state.direction='nepToNew'; render()" class="w-full p-6 rounded-2xl border-2 flex items-center justify-between ${state.direction === 'nepToNew' ? 'border-green-500 bg-green-50' : 'border-gray-200'}">
                            <span class="font-bold">Nepali → Newari</span>
                            ${state.direction === 'nepToNew' ? '<i data-lucide="check-circle" class="text-green-500"></i>' : ''}
                        </button>
                        <button onclick="state.direction='newToNep'; render()" class="w-full p-6 rounded-2xl border-2 flex items-center justify-between ${state.direction === 'newToNep' ? 'border-green-500 bg-green-50' : 'border-gray-200'}">
                            <span class="font-bold">Newari → Nepali</span>
                            ${state.direction === 'newToNep' ? '<i data-lucide="check-circle" class="text-green-500"></i>' : ''}
                        </button>
                    </div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Your Name</label>
                    <input id="userNameInput" type="text" placeholder="e.g. Birat" value="${state.user.name}" oninput="state.user.name=this.value" class="w-full p-4 bg-gray-100 rounded-xl mb-8 outline-none ring-blue-500 focus:ring-2">
                    <button onclick="saveUser(); setView('home')" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-md uppercase tracking-widest">Continue</button>
                </div>`,

            home: () => `
                <header class="bg-white border-b sticky top-0 p-4 flex justify-between items-center z-20">
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-1 text-orange-500"><i data-lucide="flame" class="fill-current" size="20"></i><span class="font-bold">${state.user.streak}</span></div>
                        <div class="flex items-center gap-1 text-yellow-500"><i data-lucide="trophy" size="20"></i><span class="font-bold">${state.user.xp}</span></div>
                    </div>
                    <div class="flex items-center gap-1 text-red-500"><i data-lucide="heart" class="fill-current" size="20"></i><span class="font-bold">${state.user.hearts}</span></div>
                </header>
                <main class="p-6 pb-24">
                    <div class="mb-8 text-center">
                        <h2 class="text-xl font-black text-gray-800 uppercase tracking-tighter">Vocabulary Path</h2>
                        <div class="h-1 w-12 bg-green-500 mx-auto mt-1 rounded-full"></div>
                    </div>
                    <div class="space-y-12 flex flex-col items-center relative">
                        <!-- Path line -->
                        <div class="absolute top-10 bottom-10 w-2 bg-gray-100 -z-10"></div>
                        
                        ${LEVELS.map((l, index) => {
                            const isLocked = state.user.xp < l.minXp;
                            const offset = index % 2 === 0 ? 'translate-x-4' : '-translate-x-4';
                            return `
                            <div class="text-center level-node ${offset}">
                                <div class="relative inline-block">
                                    <button onclick="${isLocked ? '' : `startLesson('${l.id}')`}" 
                                        class="w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-xl border-b-8 active:border-b-0 active:translate-y-1 transition-all 
                                        ${isLocked ? 'bg-gray-300 border-gray-400 grayscale' : 'bg-green-500 border-green-700 hover:bg-green-400'}">
                                        ${l.icon}
                                    </button>
                                    ${!isLocked ? '<div class="absolute -top-1 -right-1 bg-blue-500 w-6 h-6 rounded-full border-2 border-white"></div>' : ''}
                                </div>
                                <p class="mt-3 font-black text-sm uppercase tracking-tight ${isLocked ? 'text-gray-400' : 'text-gray-700'}">${l.title}</p>
                                ${isLocked ? `<p class="text-[10px] font-bold text-gray-400">${l.minXp} XP REQ</p>` : ''}
                            </div>`;
                        }).join('')}
                    </div>
                </main>
                <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t p-4 flex justify-around shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
                    <i data-lucide="home" class="text-blue-500 cursor-pointer"></i>
                    <i data-lucide="book-open" class="text-gray-400 cursor-pointer"></i>
                    <i data-lucide="users" class="text-gray-400 cursor-pointer"></i>
                    <i data-lucide="settings" class="text-gray-400 cursor-pointer"></i>
                </nav>`,

            lesson: () => {
                const current = state.activeLesson.exercises[state.activeLesson.currentIndex];
                const progress = (state.activeLesson.currentIndex / state.activeLesson.exercises.length) * 100;
                return `
                <div class="p-6 flex flex-col h-screen">
                    <div class="flex items-center gap-4 mb-8">
                        <button onclick="setView('home')"><i data-lucide="x" class="text-gray-400"></i></button>
                        <div class="flex-grow bg-gray-200 h-3 rounded-full overflow-hidden">
                            <div class="bg-green-500 h-full transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                        <div class="flex items-center gap-1 text-red-500"><i data-lucide="heart" class="fill-current" size="18"></i><span class="font-bold">${state.user.hearts}</span></div>
                    </div>
                    
                    <div class="flex-grow">
                        <h2 class="text-2xl font-black mb-6 text-gray-800 leading-tight">
                            ${current.type === 'multiple' ? 'Choose the correct meaning' : 'Speak this out loud'}
                        </h2>
                        
                        <div class="bg-blue-50 p-6 rounded-3xl border-2 border-blue-100 mb-8 relative">
                            <div class="flex items-center gap-4">
                                <button onclick="speak('${current.question}')" class="w-12 h-12 bg-white text-blue-500 rounded-2xl shadow-sm flex items-center justify-center active:scale-90 transition-transform">
                                    <i data-lucide="volume-2"></i>
                                </button>
                                <div>
                                    <p class="text-3xl font-black text-blue-900">${current.question}</p>
                                    <p class="text-blue-400 font-bold text-sm">Pronounce carefully</p>
                                </div>
                            </div>
                        </div>

                        ${current.type === 'multiple' ? `
                            <div class="grid gap-4">
                                ${current.options.map(opt => `
                                    <button onclick="checkAnswer('${opt}')" class="group p-5 border-2 rounded-2xl text-left font-bold transition-all hover:border-blue-400 active:bg-blue-50
                                        ${state.feedback?.status === 'correct' && opt === current.answer ? 'bg-green-100 border-green-500 text-green-700' : 'border-gray-200'}">
                                        <span class="w-8 h-8 inline-flex items-center justify-center rounded-lg bg-gray-100 group-hover:bg-blue-100 mr-3 text-gray-400 group-hover:text-blue-500 transition-colors">
                                            <i data-lucide="arrow-right" size="14"></i>
                                        </span>
                                        ${opt}
                                    </button>
                                `).join('')}
                            </div>` : `
                            <div class="flex flex-col items-center py-8">
                                <div class="relative">
                                    <button onclick="startListening()" class="w-32 h-32 rounded-full flex items-center justify-center shadow-xl transition-all transform active:scale-95
                                        ${state.isListening ? 'bg-red-500 animate-pulse ring-8 ring-red-100' : 'bg-blue-500 ring-8 ring-blue-50 hover:bg-blue-400'}">
                                        <i data-lucide="mic" class="text-white" size="40"></i>
                                    </button>
                                    ${state.isListening ? '<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">REC</div>' : ''}
                                </div>
                                <p class="mt-6 text-gray-500 font-black uppercase tracking-widest text-sm">
                                    ${state.isListening ? 'Listening now...' : 'Tap Mic to Start'}
                                </p>
                            </div>`}
                    </div>

                    <!-- Footer Action Bar -->
                    <div class="pt-4 border-t flex justify-between items-center gap-4">
                        ${!state.feedback ? `
                            <button onclick="checkAnswer('', true)" class="px-6 py-4 rounded-2xl font-bold text-gray-400 hover:text-gray-600 transition-colors uppercase tracking-wider text-sm">
                                Skip
                            </button>
                        ` : ''}
                    </div>

                    <!-- Result Toast -->
                    ${state.feedback ? `
                        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-6 pb-10 border-t-8 animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-50
                            ${state.feedback.status === 'correct' ? 'bg-green-50 border-green-500' : (state.feedback.status === 'skipped' ? 'bg-gray-50 border-gray-400' : 'bg-red-50 border-red-500')}">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${state.feedback.status === 'correct' ? 'bg-green-500' : (state.feedback.status === 'skipped' ? 'bg-gray-400' : 'bg-red-500')}">
                                    <i data-lucide="${state.feedback.status === 'correct' ? 'check' : (state.feedback.status === 'skipped' ? 'fast-forward' : 'x')}" class="text-white"></i>
                                </div>
                                <div>
                                    <p class="font-black text-xl ${state.feedback.status === 'correct' ? 'text-green-800' : (state.feedback.status === 'skipped' ? 'text-gray-800' : 'text-red-800')}">
                                        ${state.feedback.msg}
                                    </p>
                                </div>
                            </div>
                            <button onclick="nextStep()" class="w-full py-4 rounded-2xl font-black text-white shadow-lg transform active:translate-y-1 transition-all
                                ${state.feedback.status === 'correct' ? 'bg-green-500 hover:bg-green-600' : (state.feedback.status === 'skipped' ? 'bg-gray-700 hover:bg-gray-800' : 'bg-red-500 hover:bg-red-600')}">
                                CONTINUE
                            </button>
                        </div>` : ''}
                </div>`;
            },

            results: () => `
                <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div class="relative mb-8">
                        <i data-lucide="party-popper" class="text-yellow-400 absolute -top-8 -left-8 animate-bounce" size="40"></i>
                        <div class="w-40 h-40 bg-yellow-100 rounded-full flex items-center justify-center border-8 border-yellow-200">
                             <i data-lucide="award" class="text-yellow-600" size="80"></i>
                        </div>
                    </div>
                    <h2 class="text-3xl font-black mb-2 text-gray-800">Section Complete!</h2>
                    <p class="text-gray-500 mb-10 font-medium">You're mastering the language!</p>
                    
                    <div class="grid grid-cols-2 gap-4 w-full mb-10">
                        <div class="p-5 bg-orange-50 border-b-4 border-orange-200 rounded-3xl">
                            <p class="text-[10px] font-black text-orange-400 uppercase tracking-widest mb-1">Total XP</p>
                            <div class="flex items-center justify-center gap-2">
                                <i data-lucide="zap" size="16" class="fill-orange-500 text-orange-500"></i>
                                <p class="text-3xl font-black text-orange-700">+50</p>
                            </div>
                        </div>
                        <div class="p-5 bg-blue-50 border-b-4 border-blue-200 rounded-3xl">
                            <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">New Streak</p>
                            <div class="flex items-center justify-center gap-2">
                                <i data-lucide="flame" size="16" class="fill-blue-500 text-blue-500"></i>
                                <p class="text-3xl font-black text-blue-700">${state.user.streak}</p>
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="setView('home')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-5 rounded-3xl shadow-xl transform active:scale-95 transition-all uppercase tracking-widest">
                        Back to Path
                    </button>
                </div>`
        };

        // Initialize App
        render();
    </script>
</body>
</html>
